name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        deps: [highest]
        include:
          - php: '8.1'
            deps: lowest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=10

    env:
      DEVEXTREME_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=test;charset=utf8mb4
      DEVEXTREME_TEST_MYSQL_USER: root
      DEVEXTREME_TEST_MYSQL_PASSWORD: ''
      DEVEXTREME_TEST_PGSQL_DSN: pgsql:host=127.0.0.1;port=5432;dbname=test
      DEVEXTREME_TEST_PGSQL_USER: postgres
      DEVEXTREME_TEST_PGSQL_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist ${{ matrix.deps == 'lowest' && '--prefer-lowest' || '' }}

      - name: Code style
        if: matrix.php == '8.4' && matrix.deps == 'highest'
        run: composer cs

      - name: Static analysis
        if: matrix.php == '8.4' && matrix.deps == 'highest'
        run: composer analyse

      - name: Tests
        run: composer test
